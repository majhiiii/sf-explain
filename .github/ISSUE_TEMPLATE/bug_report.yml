name: 🐛 Bug Report
description: File a bug report for sf-explain
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing an issue to make sf-explain better!
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or commands to reproduce the behavior.
      placeholder: "1. Run 'sf explain --file deploy-result.json'..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Salesforce CLI version (`sf --version`), and plugin version (`sf plugins`).
      placeholder: "sf --version: @salesforce/cli/2.x.x\nOS: Windows / macOS / Linux\nsf-explain: 0.1.0"
    validations:
      required: true
